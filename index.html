<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lời chúc dành cho em ❤️</title>
    <link
      rel="icon"
      type="image/png"
      href="https://i.postimg.cc/prmm9Kdq/logo.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style/style.css" />
  </head>
  <body>
    <div id="intro-screen">
      <div id="intro-text">Chạm vào trái tim</div>
      <div id="heart" role="button" aria-label="Bắt đầu trình chiếu">❤️</div>
    </div>

    <div class="stars" id="stars" aria-hidden="true"></div>

    <div id="slides"></div>

    <div
      class="falling-container"
      id="falling-container"
      aria-hidden="true"
    ></div>

    <div class="progress-dots" id="progress-dots"></div>

    <audio id="bg-music" loop>
      <source src="./style/nhac.mp3" type="audio/mpeg" />
    </audio>

    <script src="./style/script.js"></script>
  </body>
</html>
